<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>میڈیا مینیجر - حسین ای سروسز</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 360px; /* 360px چوڑائی کے لیے فکسڈ */
            text-align: center;
        }

        h2 {
            margin: 12px 0;
            color: #00adb5;
            font-size: 20px;
            letter-spacing: 0.5px;
        }

        .upload-btn {
            background-color: #00adb5;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            width: 100%;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .upload-btn:active {
            background-color: #008188;
        }

        /* 360px پر 4 تھمب نیلز ایک لائن میں سیٹ کرنے کے لیے */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            padding: 5px 0;
        }

        .thumbnail-card {
            background-color: #1e1e1e;
            border-radius: 6px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid #2d2d2d;
            transition: transform 0.1s;
        }

        .thumbnail-card:active {
            transform: scale(0.95);
        }

        .thumbnail-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* جب کوئی فائل نہ ہو تو یہ اسٹائل چلے گا */
        .no-data {
            grid-column: 1 / -1;
            padding: 50px 10px;
            color: #ff4a4a;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ایکشن مینو پاپ اپ (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            width: 85%;
            max-width: 280px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            border: 1px solid #333;
        }

        .modal-title {
            margin-bottom: 15px;
            font-size: 15px;
            color: #00adb5;
            font-weight: bold;
        }

        .modal-btn {
            display: block;
            width: 100%;
            padding: 11px;
            margin: 8px 0;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-download { background-color: #28a745; color: white; }
        .btn-replace { background-color: #ffc107; color: #121212; }
        .btn-delete { background-color: #dc3545; color: white; }
        .btn-cancel { background-color: #444444; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <h2>میڈیا گیلری</h2>
        
        <button class="upload-btn" onclick="triggerImagePicker()">نئی فائل اپلوڈ کریں</button>
        
        <div class="gallery-grid" id="gallery">
            <div class="no-data">No Files Uploaded</div>
        </div>
    </div>

    <div class="modal" id="actionModal">
        <div class="modal-content">
            <div class="modal-title">آپشن منتخب کریں</div>
            <button class="modal-btn btn-download" onclick="handleDownload()">Download</button>
            <button class="modal-btn btn-replace" onclick="handleReplace()">Replace</button>
            <button class="modal-btn btn-delete" onclick="handleDelete()">Delete</button>
            <button class="modal-btn btn-cancel" onclick="closeModal()">کینسل</button>
        </div>
    </div>

    <script>
        // --- آپ کے فراہم کردہ JSON کے مطابق آٹو کنفیگریشن ---
        const firebaseConfig = {
            apiKey: "AIzaSyDhBSYrjhZMTtIQbGox7GRwyQgD_zpieAU",
            authDomain: "e-services-1801a.firebaseapp.com",
            databaseURL: "https://e-services-1801a-default-rtdb.firebaseio.com",
            projectId: "e-services-1801a",
            storageBucket: "e-services-1801a.firebasestorage.app",
            messagingSenderId: "704425720967",
            appId: "1:704425720967:android:805848215daebc79998c22"
        };

        // فائربیس انیشلائزیشن
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        let currentMobile = ""; 
        let selectedFileKey = "";
        let selectedFileUrl = "";

        // --- کوڈولار ٹائنی ڈی بے سے موبائل نمبر حاصل کرنا ---
        window.addEventListener('DOMContentLoaded', () => {
            if (window.AppInventor) {
                currentMobile = window.AppInventor.getWebViewString();
                if(currentMobile) startListening(currentMobile);
            }
            
            window.onWebViewStringChange = function(value) {
                // اگر کوڈولار سے کوئی نیا نمبر یا اپڈیٹ آئے
                if(value && value !== "upload_done" && !value.startsWith("download|") && !value.startsWith("replace|")) { 
                    currentMobile = value;
                    startListening(value);
                }
            };
        });

        // ریل ٹائم لسنر (جب بھی ڈیٹا بیس میں تبدیلی ہوگی، سکرین خود ہی اپڈیٹ ہو جائے گی)
        function startListening(mobileNumber) {
            const dbRef = database.ref('Users/' + mobileNumber + '/Images');
            
            dbRef.on('value', (snapshot) => {
                const galleryContainer = document.getElementById('gallery');
                galleryContainer.innerHTML = ''; // پرانا ویو صاف کریں
                
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    let hasFiles = false;
                    
                    for (let key in data) {
                        let imageUrl = data[key];
                        if(imageUrl) {
                            hasFiles = true;
                            const card = document.createElement('div');
                            card.className = 'thumbnail-card';
                            card.onclick = () => openModal(key, imageUrl);
                            
                            const img = document.createElement('img');
                            img.src = imageUrl;
                            img.loading = "lazy";
                            
                            card.appendChild(img);
                            galleryContainer.appendChild(card);
                        }
                    }
                    
                    if(!hasFiles) {
                        showNoFilesMessage(galleryContainer);
                    }
                } else {
                    showNoFilesMessage(galleryContainer);
                }
            });
        }

        function showNoFilesMessage(container) {
            container.innerHTML = '<div class="no-data">No Files Uploaded</div>';
        }

        // کوڈولار امیج پکر کو سگنل بھیجنا
        function triggerImagePicker() {
            if (window.AppInventor) {
                window.AppInventor.setWebViewString("open_image_picker");
            }
        }

        // پاپ اپ مینو ہینڈلنگ
        function openModal(key, url) {
            selectedFileKey = key;
            selectedFileUrl = url;
            document.getElementById('actionModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('actionModal').style.display = 'none';
        }

        // 1. ڈاؤنلوڈ ایکشن
        function handleDownload() {
            closeModal();
            if (window.AppInventor) {
                window.AppInventor.setWebViewString("download|" + selectedFileUrl);
            } else {
                window.open(selectedFileUrl, '_blank');
            }
        }

        // 2. ریپلیس ایکشن
        function handleReplace() {
            closeModal();
            if (window.AppInventor) {
                window.AppInventor.setWebViewString("replace|" + selectedFileKey);
            }
        }

        // 3. ڈیلیٹ ایکشن
        function handleDelete() {
            closeModal();
            if(confirm("کیا آپ واقعی یہ فائل ڈیلیٹ کرنا چاہتے ہیں؟")) {
                database.ref('Users/' + currentMobile + '/Images/' + selectedFileKey).remove()
                .then(() => {
                    // ریل ٹائم لسنر کی وجہ سے پیج خود ہی اپڈیٹ ہو جائے گا
                }).catch((error) => {
                    alert("فائل ڈیلیٹ کرنے میں خرابی آئی۔");
                });
            }
        }
    </script>
</body>
</html>
